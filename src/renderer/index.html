<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy: no remote code. `data:` and `blob:` are required
      for imported rasters, in-memory SVG symbols and canvas export. Style
      `unsafe-inline` is needed by Fabric.js's inline canvas styling.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' ws://localhost:5173 http://localhost:5173"
    />
    <title>Pagan Logo Maker — Design Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
